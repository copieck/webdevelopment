<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Todo List</title>

    <style>
        label {
            font-size: 18px;
        }

        input:checked + label {
            text-decoration: line-through;
            color: gray;
        }
    </style>
</head>
<body>

<input type="text" id="taskInput">
<button onclick="addTask()">Add</button>
<br><br>

<div id="list">
    <input type="checkbox" id="task1">
    <label for="task1"> DAAAAAA YANKEES LOSE</label><br>

    <input type="checkbox" id="task2">
    <label for="task2"> DAAAAAA YANKEES LOSE</label><br>

    <input type="checkbox" id="task3">
    <label for="task3"> DAAAAAA YANKEES LOSE</label><br>
</div>

<script>
    let count = 4;

    function addTask() {
        let input = document.getElementById("taskInput");
        let text = input.value.trim();

        if (text === "") return; // prevent empty tasks

        let list = document.getElementById("list");


        let checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.id = "task" + count;

        let label = document.createElement("label");
        label.setAttribute("for", "task" + count);
        label.textContent = " " + text;

        list.appendChild(checkbox);
        list.appendChild(label);
        list.appendChild(document.createElement("br"));

        let current_cookie = getCookie("task");
        setCookie("task",current_cookie + "|" + text,15);



        count++;
        input.value = "";
    }


    function setCookie(cname, cvalue, exdays) {
        const d = new Date();
        d.setTime(d.getTime() + (exdays*24*60*60*1000));
        let expires = "expires="+ d.toUTCString();
        document.cookie = cname + "=" + cvalue + ";" + expires + ";path=/";
    }

    function getCookie(cname) {
        let name = cname + "=";
        let decodedCookie = decodeURIComponent(document.cookie);
        let ca = decodedCookie.split(';');
        for(let i = 0; i <ca.length; i++) {
            let c = ca[i];
            while (c.charAt(0) == ' ') {
                c = c.substring(1);
            }
            if (c.indexOf(name) == 0) {
                return c.substring(name.length, c.length);
            }
        }
        return "";
    }

</script>
</body>
