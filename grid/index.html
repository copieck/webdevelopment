<!DOCTYPE html>
<html>
<head>
  <style>
    .container {
      display: grid;
      grid-template-areas:
    "header header"
    "menu content"
    "footer footer";
      grid-template-columns: 1fr 3fr;
      gap: 3px;
      background-color: dodgerblue;
      padding: 5px;
    }
    .container div {
      background-color: white;
      padding: 10px;
    }
    .container div.header {
      grid-area: header;
      text-align: center;
    }
    .container div.menu {
      grid-area: menu;
    }
    .container div.content {
      grid-area: content;
    }
    .container div.footer {
      grid-area: footer;
      text-align: center;
    }
  </style>
</head>
<body>



<div class="container">
  <div class="header"><h2>LOTR Characters</h2></div>
  <div class="menu"><a href="https://lotr.fandom.com/wiki/Bilbo_Baggins">Bilbo</a><br><a href="https://lotr.fandom.com/wiki/Gollum">Gollum</a><br><a href="https://lotr.fandom.com/wiki/Gandalf">Gandalf</a></div>
  <div class="content"><h3>The Company of Thorin</h3><p>Balin, Dwalin, Oin, Gloin, Fili, Kili, Dori, Ori, Nori, Bifur, Bofur, Bombur</p><img src="Company.webp" width="250" height="200"></div>
  <div class="footer"><h4>Footer</h4></div>
</div>

</body>
</html>
